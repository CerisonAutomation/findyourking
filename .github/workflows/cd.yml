# ==========================================
# ZENITH CI/CD PIPELINE - CONTINUOUS DEPLOYMENT
# Automated deployment to production
# ==========================================

name: 🚢 CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  PNPM_VERSION: 'latest'

jobs:
  # ==========================================
  # Job 1: Deploy to Vercel Production
  # ==========================================
  deploy-production:
    name: 🚀 Deploy to Production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://findyourking.vercel.app

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 🏗️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: 📚 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔨 Build Project
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: 🚀 Deploy to Vercel
        id: deploy
        run: |
          npm install -g vercel@latest
          DEPLOYMENT_URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }} 2>&1 | tail -1)
          echo "deployment_url=$DEPLOYMENT_URL" >> $GITHUB_OUTPUT
          echo "✅ Deployed to: $DEPLOYMENT_URL"
        continue-on-error: true

      - name: 📊 Create deployment summary
        run: |
          echo "## 🚀 Deployment Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** https://findyourking.vercel.app" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Timestamp:** $(date -u)" >> $GITHUB_STEP_SUMMARY

  # ==========================================
  # Job 2: Post-Deployment Health Check
  # ==========================================
  health-check:
    name: 🏥 Health Check
    runs-on: ubuntu-latest
    needs: [deploy-production]
    timeout-minutes: 10
    continue-on-error: true

    steps:
      - name: ⏳ Wait for deployment
        run: sleep 30

      - name: 🏥 Check deployment health
        run: |
          curl -f https://findyourking.vercel.app/ || exit 1
          echo "✅ Health check passed"
        continue-on-error: true

      - name: 💡 Run Lighthouse
        run: |
          npm install -g @lhci/cli@0.12.x
          lhci healthcheck --url=https://findyourking.vercel.app || echo "Warning: Lighthouse check failed"
        continue-on-error: true

  # ==========================================
  # Job 3: Notify Success
  # ==========================================
  notify:
    name: 📢 Notify Team
    runs-on: ubuntu-latest
    needs: [deploy-production]
    if: success()
    continue-on-error: true

    steps:
      - name: 📢 Success notification
        run: |
          echo "🎉 Production deployment successful!"
          echo "🌐 Live at: https://findyourking.vercel.app"
          echo "📦 Version: ${{ github.sha }}"

      # Optional: Slack notification
